name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-sitemap.mjs reads each page's last commit date; a shallow
          # checkout only has the latest commit, which breaks that for every
          # page the latest commit didn't touch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Every local reference resolves
        run: node scripts/check-assets.mjs
      - name: Markup is clean of the Sitejet runtime
        run: node scripts/sanitize.mjs --check
      - name: Slot manifest is up to date
        run: node scripts/build-slots.mjs --check
      - name: Sitemap is up to date
        run: node scripts/build-sitemap.mjs --check

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the site, not the repository: tooling, docs and repo metadata
      # have no business being served from the domain.
      - name: Stage the site
        run: >
          rsync -a
          --exclude='.git*' --exclude='.github/' --exclude='_site/'
          --exclude='docs/' --exclude='scripts/' --exclude='README.md'
          ./ _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
